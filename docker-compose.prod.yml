services:
  postgres:
    image: postgres:16-alpine
    container_name: classpeak-postgres
    restart: always
    environment:
      POSTGRES_DB: classpeak_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-classpeak_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classpeak_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - classpeak-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classpeak-backend
    restart: always
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/classpeak_scheduler
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-classpeak_secret_2026}
      CORS_ALLOWED_ORIGINS: "http://168.75.94.66,http://localhost"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - classpeak-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classpeak-frontend
    restart: always
    networks:
      - classpeak-net

  nginx:
    image: nginx:alpine
    container_name: classpeak-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - classpeak-net

volumes:
  postgres_data:

networks:
  classpeak-net:
    driver: bridge
