services:
  postgres:
    image: postgres:16
    container_name: classpeak-postgres
    environment:
      POSTGRES_DB: classpeak_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - classpeak-postgres-data:/var/lib/postgresql/data

volumes:
  classpeak-postgres-data:
